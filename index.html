<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maxim Keremet | CV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>

<body>
  <!-- Header -->
  <header class="bg-primary text-white py-5">
    <div class="container">
      <div class="row align-items-center">
        
        <!-- Profile image -->
        <div class="col-md-3 text-center text-md-start mb-3 mb-md-0">
          <img src="pics/ghibi-avatar.png" 
               alt="Maxim Keremet" 
               class="rounded-circle img-thumbnail" 
               style="width: 150px; height: 150px; object-fit: cover;">
        </div>
        
        <!-- Name, title, contacts -->
        <div class="col-md-9">
          <h1 class="mb-1">Maxim Keremet</h1>
          <p class="text-light mb-2">DATA ENGINEER · MLOPS</p>
          <p class="mb-1">
            <a href="mailto:maximkeremet@gmail.com" class="text-white">maximkeremet@gmail.com</a> |
            <a href="https://github.com/maximkeremet" target="_blank" class="text-white">maximkeremet</a> |
            <a href="https://www.linkedin.com/in/maximkeremet" target="_blank" class="text-white">LinkedIn</a>
          </p>
          <p class="mb-0">Helsinki, Finland | Blue card holder</p>
        </div>

      </div>
    </div>
  </header>

  <div class="container my-5">
    <!-- Include sections -->
    <div id="skills-section"></div>
    <div id="experience-section"></div>
    <div id="extracurricular-section"></div>
    <div id="education-section"></div>
  </div>

  <script>
    // Load each section dynamically
    async function loadSection(id, file) {
      const resp = await fetch(file);
      const html = await resp.text();
      document.getElementById(id).innerHTML = html;
    }

    loadSection('skills-section', 'sections/skills.html');
    loadSection('experience-section', 'sections/experience.html');
    loadSection('extracurricular-section', 'sections/extracurricular.html');
    loadSection('education-section', 'sections/education.html');
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
